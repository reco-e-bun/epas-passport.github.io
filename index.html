<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>European Union Passport Simulation</title>
    <style>
        :root {
            --bg-color: #1a2232;
            --paper-color: #f7f6ec;
            --text-gold: #e2c174;
            --text-white: #ffffff;
            --text-gray: #888888;
            --placeholder-color: rgba(0, 0, 0, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .passport-app {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 850px;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        /* --- Header Styles --- */
        header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 20px 0 40px 0;
            text-align: center;
        }

        .eu-emblem {
            width: 40px;
            height: 40px;
        }

        .header-text h1 {
            font-size: 16px;
            letter-spacing: 2px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .header-text h2 {
            font-size: 11px;
            letter-spacing: 3px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.6);
        }

        /* --- Passport Page Viewport --- */
        .book-viewport {
            flex-grow: 1;
            position: relative;
            width: 100%;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            background-color: var(--paper-color);
            background-position: center;
        }

        .slider {
            display: flex;
            height: 100%;
            width: 100%;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .page {
            flex: 0 0 100%;
            height: 100%;
            position: relative;
        }

        .page-header {
            position: absolute;
            top: 20px;
            left: 20px;
            font-family: "Courier New", Courier, monospace;
            font-size: 12px;
            color: #555;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .page-number-display {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
            color: #444;
            font-weight: bold;
        }

        /* --- Visas Placements --- */
        .visa-slot {
            position: absolute;
            /* Maintaining a 1:1 aspect ratio representing the 318x318 PNG while scaling to fit 6-7 on page */
            width: 120px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .visa-placeholder {
            width: 100%;
            height: 100%;
            border: 2px dashed var(--placeholder-color);
            border-radius: 6px;
            color: var(--placeholder-color);
            font-family: "Courier New", Courier, monospace;
            font-size: 10px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 5px;
        }

        .visa-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            mix-blend-mode: multiply; /* Helps the PNG blend realistically with the page grid */
            opacity: 0.9;
        }

        /* --- Footer Navigation --- */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 10px 10px 10px;
        }

        button {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 18px;
            cursor: pointer;
            padding: 10px;
            transition: color 0.2s;
        }

        button:hover {
            color: var(--text-white);
        }

        button:disabled {
            color: rgba(255, 255, 255, 0.1);
            cursor: not-allowed;
        }

        .indicator {
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="passport-app">
        <header>
            <div class="eu-emblem" id="emblem-left"></div>
            <div class="header-text">
                <h1>EUROPEAN UNION</h1>
                <h2>PASSPORT</h2>
            </div>
            <div class="eu-emblem" id="emblem-right"></div>
        </header>

        <main class="book-viewport">
            <div class="slider" id="slider">
                </div>
        </main>

        <footer>
            <button id="prevBtn" disabled>&#10094;</button>
            <div class="indicator" id="pageIndicator">01 / 04</div>
            <button id="nextBtn">&#10095;</button>
        </footer>
    </div>

    <script>
        // Get cookie
        function getCookie(cname) {
            let name = cname + "=";
            let decodedCookie = decodeURIComponent(document.cookie);
            let ca = decodedCookie.split(';');
            for(let i = 0; i <ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) == ' ') {
                c = c.substring(1);
                }
                if (c.indexOf(name) == 0) {
                return c.substring(name.length, c.length);
                }
            }
            return "";
        }

        let acquiredVisasCookie = getCookie("acquiredVisas")
        if (acquiredVisasCookie === ""){
            visas = []
        }else{
            visas = Array.from(new Set(getCookie("acquiredVisas").split("|")))
        }

        const countries = ["austria","belgium","bulgaria","croatia","cyprus","czechia","denmark","estonia","finland","france","germany","greece","hungary","ireland","italy","latvia","lithuania","luxembourg","malta","netherlands","poland","portugal","romania","slovakia","slovenia","spain","sweden"]

        const TOTAL_PAGES = 4;
        let currentPage = Math.floor(visas.length / 7) + 1;
        console.log(currentPage)

        // Generate EU Stars
        function generateEUStars() {
            let stars = '';
            for (let i = 0; i < 12; i++) {
                const angle = (i * 30) * (Math.PI / 180);
                const x = 50 + 35 * Math.cos(angle);
                const y = 50 + 35 * Math.sin(angle);
                stars += `<path d="M${x} ${y-3} L${x+1} ${y-1} L${x+3} ${y-1} L${x+1.5} ${y+0.5} L${x+2} ${y+3} L${x} ${y+1.5} L${x-2} ${y+3} L${x-1.5} ${y+0.5} L${x-3} ${y-1} L${x-1} ${y-1} Z" fill="var(--text-gold)" />`;
            }
            return `<svg viewBox="0 0 100 100" width="100%" height="100%">${stars}</svg>`;
        }

        document.getElementById('emblem-left').innerHTML = generateEUStars();
        document.getElementById('emblem-right').innerHTML = generateEUStars();

        // Exact 27 Predetermined Visa Placements strictly designed to not overlap
        const placements = [
            // PAGE 1: 7 Visas
            { page: 1, top: 12, left: 10, rotation: -5 },
            { page: 1, top: 15, left: 55, rotation: 10 },
            { page: 1, top: 35, left: 20, rotation: 15 },
            { page: 1, top: 38, left: 65, rotation: -8 },
            { page: 1, top: 55, left: 10, rotation: -12 },
            { page: 1, top: 60, left: 55, rotation: 5 },
            { page: 1, top: 75, left: 30, rotation: -3 },
            
            // PAGE 2: 7 Visas
            { page: 2, top: 14, left: 20, rotation: 8 },
            { page: 2, top: 10, left: 65, rotation: -15 },
            { page: 2, top: 32, left: 10, rotation: 3 },
            { page: 2, top: 36, left: 50, rotation: -6 },
            { page: 2, top: 52, left: 65, rotation: 12 },
            { page: 2, top: 58, left: 15, rotation: -4 },
            { page: 2, top: 78, left: 50, rotation: 9 },

            // PAGE 3: 7 Visas
            { page: 3, top: 10, left: 15, rotation: -10 },
            { page: 3, top: 18, left: 60, rotation: 14 },
            { page: 3, top: 30, left: 40, rotation: -3 },
            { page: 3, top: 48, left: 10, rotation: 5 },
            { page: 3, top: 50, left: 60, rotation: -8 },
            { page: 3, top: 70, left: 25, rotation: 11 },
            { page: 3, top: 75, left: 65, rotation: -5 },

            // PAGE 4: 6 Visas
            { page: 4, top: 15, left: 30, rotation: 6 },
            { page: 4, top: 20, left: 70, rotation: -11 },
            { page: 4, top: 38, left: 15, rotation: -4 },
            { page: 4, top: 45, left: 55, rotation: 15 },
            { page: 4, top: 65, left: 10, rotation: -2 },
            { page: 4, top: 68, left: 60, rotation: 7 }
        ];

        const slider = document.getElementById('slider');

        // Build Pages
        for (let i = 1; i <= TOTAL_PAGES; i++) {
            const pageDiv = document.createElement('div');
            pageDiv.className = 'page';
            
            pageDiv.innerHTML = `
                <div class="page-header">VISAS</div>
                <div class="page-number-display">0${i}</div>
            `;

            // Filter placements specifically for this page
            const pagePlacements = placements.filter(p => p.page === i);

            pagePlacements.forEach((slot, index) => {
                // Mock logic: 70% chance a visa is populated, 30% chance it stays empty
                // const hasVisa = Math.random() > 0;
                
                let contentHTML = '';
                if ((i - 1) * 7 + index < visas.length && countries.includes(visas[(i - 1) * 7 + index])) {
                    // Utilizing a mock 318x318 PNG image
                    contentHTML = `<img class="visa-image" src="visas/${visas[(i - 1) * 7 + index]}.png" alt="Visa">`;
                } else {
                    // Empty placeholder outline
                    // contentHTML = `<div class="visa-placeholder">EMPTY SLOT</div>`;
                }

                pageDiv.innerHTML += `
                    <div class="visa-slot" style="top: ${slot.top}%; left: ${slot.left}%; transform: rotate(${slot.rotation}deg);">
                        ${contentHTML}
                    </div>
                `;
            });

            slider.appendChild(pageDiv);
        }

        // Navigation controls
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const pageIndicator = document.getElementById('pageIndicator');
        
        console.log(currentPage)

        function updateSlider() {
            slider.style.transform = `translateX(-${(currentPage - 1) * 100}%)`;
            pageIndicator.textContent = `0${currentPage} / 0${TOTAL_PAGES}`;
            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage === TOTAL_PAGES;
        }

        updateSlider()

        prevBtn.addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                updateSlider();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentPage < TOTAL_PAGES) {
                currentPage++;
                updateSlider();
            }
        });

    </script>
</body>
</html>
